<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Interactive Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Magic Eight Ball CSS -->
    <link rel="stylesheet" href="css/magic-eight-ball.css">

    <!-- Main JavaScript -->
    <script defer src="js/script.js"></script>

    <!-- Magic Eight Ball JavaScript -->
    <script defer src="js/magic-eight-ball.js"></script>

    <!-- Task Manager JavaScript -->
    <script defer src="js/task-manager.js"></script>

    <!-- Bootstrap JavaScript -->
    <script defer
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>
</head>

<body>

    <h1>My Interactive Dashboard</h1>

    <p>
        This dashboard was created by Adriana Carballeda
        for the WEB-115 course at Wake Tech.
    </p>

    <script>
        document.write(
            "This dashboard demonstrates how JavaScript can be used to create interactive websites."
        );
    </script>

    <noscript>
        Unfortunately, your web browser does not support JavaScript.
    </noscript>

    <div class="container">

        <div class="row">

            <!-- Magic Eight Ball Application -->
            <div class="col" id="magic-eight-ball">

                <h2 class="heading">Magic Eight Ball</h2>

                <form>

                    <p>
                        Type a yes/no question below, then click on the Eight Ball
                        below to get your answer!
                    </p>

                    <input id="question" name="question" size="80">

                    <div id="magicEightBall">
                        <div id="circle"></div>

                        <img id="ball"
                             src="img/magic-eight-ball.png"
                             alt="Magic Eight Ball">

                    </div>

                    <button id="reset"
                            name="reset"
                            type="reset">
                        Ask another question
                    </button>

                </form>
                <br>

            </div>
            
            <div class="col" id="weekly-tasks">
                <div id="task-list">

                    <h3>Weekly Task List</h3>

                    <p>Enter a task below to manage your goals.</p>

                    <form>
                        <label for="task-name">Enter task:</label>
                        <input type="text" id="task-name">

                        <button type="button" id="add-task">
                            Add Task
                        </button>
                    </form>

                </div>

            </div>    

        </div>

    </div>

</body>

</html>
